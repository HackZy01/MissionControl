name: Build Mission Control

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install libjpeg-turbo (dependency)
        run: |
          dkp-pacman -Syy
          dkp-pacman -S --noconfirm switch-libjpeg-turbo

      - name: Build Mission Control
        run: |
          make dist -j$(nproc)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: missioncontrol-dist
          path: dist/*.zip
